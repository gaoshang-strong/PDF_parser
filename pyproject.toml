[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-parser"
version = "0.1.0"
description = "PDF parser bake-off framework for scientific and biomedical PDFs"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pymupdf>=1.20",
    "requests>=2.28",
]

[project.scripts]
pdf-parser = "pdf_parser.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_parser"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
